
<!DOCTYPE html>
<html>
<head>
    <title>SecureAI HR Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            color: #4c1d95;
            font-size: 36px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(76, 29, 149, 0.15);
            border-top: 4px solid #ea580c;
        }

        .card h2 {
            color: #7c3aed;
            font-size: 20px;
        }

        .card p {
            color: #666;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5b21b6;
        }

        .logout {
            display: inline-block;
            margin-top: 35px;
            color: #ea580c;
            text-decoration: none;
        }

        .logout:hover {
            color: #c2410c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SecureAI HR Assistant</h1>

        <p class="subtitle">
            Secure HR Assistance with AI Security Features
        </p>

        <div class="cards">

            <div class="card">
                <h2>HR Chatbot</h2>

                <p>
                    Get answers to common HR questions.
                </p>

                <a href="{% url 'hr_chatbot' %}" class="btn">
                    Open Chatbot
                </a>
            </div>

            <div class="card">
                <h2>Security Scanner</h2>

                <p>
                    Detect suspicious instructions and protect data.
                </p>

                <a href="{% url 'security_scanner' %}" class="btn">
                    Scan Message
                </a>
            </div>

            <div class="card">
                <h2>Security Dashboard</h2>

                <p>
                    Monitor security events and audit logs.
                </p>

                <a href="{% url 'security_dashboard' %}" class="btn">
                    View Dashboard
                </a>
            </div>

        </div>

        <a href="{% url 'user_logout' %}" class="logout">
            Logout
        </a>

    </div>

</body>
</html>
